[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h-ssh"
version = "0.0.0"
description = "Operational commands and configuration changes across fleets of network devices"
requires-python = ">=3.10"
dependencies = ["junos-eznc"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
h-ssh = "hssh.frontends.cli:main_sync"

[tool.setuptools.packages.find]
where = ["h-app"]
include = ["hssh*"]

[tool.pytest.ini_options]
testpaths = ["h-app/tests"]

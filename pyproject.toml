[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h-ssh"
dynamic = ["version"]
description = "Multi-vendor network automation framework with parallel execution, job mode, and safety gate"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
dependencies = [
    "paramiko",
]

[project.optional-dependencies]
junos = ["junos-eznc"]
all = ["junos-eznc"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "junos-eznc",
]

[project.scripts]
h-ssh = "hssh.cli:main_sync"
h-ssh-store = "hssh.store:main_sync"

# Drivers from outside the package register here too: an entry point names a
# Driver, a list of them, or a callable returning either (see hssh/drivers).
[project.entry-points."hssh.drivers"]
builtin = "hssh.drivers:BUILTIN"

[tool.setuptools]
package-dir = {"" = "h-app"}

[tool.setuptools.dynamic]
version = {attr = "hssh.__version__"}

[tool.setuptools.packages.find]
where = ["h-app"]
include = ["hssh*"]

[tool.setuptools.package-data]
hssh = ["dialects/*.json"]

[tool.pytest.ini_options]
pythonpath = ["h-app"]
testpaths = ["h-app/tests"]
